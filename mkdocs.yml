site_name: EDChar Docs
site_description: EDChar – an Earthdawn character helper, and how it was built with agentic development.
site_url: https://tschuchi.github.io/EDChar-Docs/
repo_name: EDChar-Docs
repo_url: https://github.com/Tschuchi/EDChar-Docs
edit_uri: ""
copyright: Earthdawn is a Registered Trademark of FASA Corporation. All Rights Reserved.
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Showcase: Showcase
            Architecture: Architektur
            Decisions (ADR): Entscheidungen (ADR)
            Handbook: Handbuch
            Players: Spieler
            Game Masters: Spielleiter
            Rules and why they exist: Regeln und ihre Entstehung
            Starting point: Ausgangslage
            "The setup: five instances": "Das Setup: fünf Instanzen"
            Ticket workflow and the Next field: Ticket-Ablauf und Nächster-Feld
            CLAUDE.md as a working contract: CLAUDE.md als Arbeitsvertrag
            One ticket, end to end: Ein Ticket von Anfang bis Ende
            Environments and CI/CD: Umgebungen und CI/CD
            API overview: API-Überblick
            Data model: Datenmodell
            Authentication and ownership: Authentifizierung und Besitzprüfung
            Multiple languages: Mehrsprachigkeit
            Versions and build ID: Versionen und Build-Kennung
            Incidents: Vorfälle
            Facts and figures: Zahlen und Fakten
            Limits and transferability to teams: Grenzen und Übertragbarkeit auf Teams

nav:
  - Home: index.md
  - Showcase:
      - showcase/index.md
      - Starting point: showcase/starting-point.md
      - "The setup: five instances": showcase/setup.md
      - Ticket workflow and the Next field: showcase/workflow.md
      - CLAUDE.md as a working contract: showcase/claude-md.md
      - Rules and why they exist: showcase/rules.md
      - GoLive: showcase/golive.md
      - Testing: showcase/testing.md
      - One ticket, end to end: showcase/end-to-end.md
      - Facts and figures: showcase/facts.md
      - Incidents: showcase/incidents.md
      - Limits and transferability to teams: showcase/limits.md
  - Architecture:
      - architektur/index.md
      - API overview: architektur/api.md
      - Data model: architektur/data-model.md
      - Environments and CI/CD: architektur/environments.md
      - Authentication and ownership: architektur/security.md
      - Multiple languages: architektur/i18n.md
      - Versions and build ID: architektur/versioning.md
  - Decisions (ADR):
      - adr/index.md
      - 0001 Multiple agent instances: adr/0001-multiple-agent-instances.md
      - 0002 Control model: adr/0002-control-model.md
      - 0003 Markdown board in Git: adr/0003-markdown-board-in-git.md
      - 0004 Ticket lifecycle: adr/0004-ticket-lifecycle.md
      - 0005 Observed or derived: adr/0005-observed-or-derived.md
      - 0006 GoLive: adr/0006-golive.md
      - 0007 One version per GoLive: adr/0007-one-version-per-golive.md
      - 0008 API tests after every deploy: adr/0008-api-tests-after-every-deploy.md
      - 0009 UI tests with Playwright: adr/0009-ui-tests-with-playwright.md
      - 0010 Consolidating a grown API: adr/0010-consolidating-a-grown-api.md
      - 0011 charKey at the interface: adr/0011-charkey-at-the-interface.md
      - 0012 Characters linked by user ID: adr/0012-characters-linked-by-user-id.md
      - 0013 Character documents as Markdown: adr/0013-character-documents-as-markdown-files.md
      - 0014 Own Markdown editor: adr/0014-own-markdown-editor.md
      - 0015 Securing the web root: adr/0015-securing-the-web-root.md
  - Handbook:
      - handbuch/index.md
      - Players: handbuch/spieler.md
      - Game Masters: handbuch/spielleiter.md
